[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "codmav"
version = "0.2.0"
description = "Video-KYC fraud detection with drift and novel-attack monitoring (research prototype)"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Research prototype - see docs/RESEARCH_NOTES.md for third-party data/model licenses" }

[tool.setuptools.packages.find]
include = ["backend*", "ml*", "training*", "monitoring*", "experiments*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
