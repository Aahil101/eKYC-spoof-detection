job: m2_clip_probe
run_name: m2_clip_probe_ffpp_c23
implemented: false        # milestone 3
module: M2
seed: 0
description: >
  Frozen CLIP ViT-B/16 face-crop embeddings (cached) + logistic-regression probe with
  temperature scaling (UnivFD-style, RESEARCH_NOTES [21]). Training data: FF++ c23 real/fake
  plus SBI pseudo-fakes [20]. CPU default model; Kaggle GPU only speeds up embedding extraction.
params:
  backbone: ViT-B-16
  pretrained: openai
  frames_per_video: 16
  face_margin: 0.25
  probe: logreg
  calibration: temperature
modes:
  smoke:
    max_videos_per_class: 8
    device: cpu
  full:
    max_videos_per_class: null
    device: cuda
checkpoint:
  every_steps: 200          # here: videos embedded between cache flushes
  every_minutes: 10
  keep_last: 2
budget:
  max_wall_minutes: 660
data:
  datasets: [ffpp_c23, celebdf_v2]
kaggle:
  accelerator: gpu
  internet: false
  pip_packages: [open_clip_torch, mediapipe, scikit-learn]
  weights_datasets: [codmav-weights-openclip-vitb16, codmav-weights-mediapipe]
